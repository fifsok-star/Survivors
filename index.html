<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Survivors</title>
<meta name="description" content="Survivors – co-op climbing adventure for 2–6 players, right in the browser.">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0d2a3a;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#3a2a17;user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:5;padding:16px;overflow:auto}
#logoBg{position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(8,30,44,0) 30%,rgba(8,30,44,.55) 100%);z-index:1;pointer-events:none}
h1.logo{font-size:clamp(44px,9vw,104px);margin:0;letter-spacing:.06em;color:#ffe9a8;-webkit-text-stroke:3px #5a2f12;text-shadow:0 6px 0 #5a2f12,0 12px 24px rgba(0,0,0,.45);font-weight:900;transform:rotate(-2deg)}
.sub{color:#fff;font-size:18px;text-shadow:0 2px 6px #000;margin:6px 0 16px;text-align:center}
.panel{background:linear-gradient(#f6e6bd,#e9d19a);border:4px solid #6b4423;border-radius:18px;box-shadow:0 10px 0 #4a2d14,0 18px 40px rgba(0,0,0,.5);padding:18px 22px;max-width:min(960px,96vw)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;margin:8px 0}
input[type=text]{font:inherit;font-size:18px;font-weight:700;padding:10px 12px;border-radius:10px;border:3px solid #6b4423;background:#fff8e2;color:#3a2a17;outline:none;width:210px}
#code{width:120px;text-transform:uppercase;letter-spacing:.2em;text-align:center}
button{font:inherit;font-size:18px;font-weight:800;padding:10px 20px;border-radius:12px;border:3px solid #4a2d14;background:#f4a83a;color:#3a1f08;cursor:pointer;box-shadow:0 5px 0 #4a2d14;transition:transform .06s}
button:hover{filter:brightness(1.08)}button:active{transform:translateY(4px);box-shadow:0 1px 0 #4a2d14}
button.alt{background:#7fc8d8}button.grn{background:#8fd35a}button.red{background:#ee7a66}button.dc{background:#8f9bf5;color:#fff}
.err{color:#b3261e;font-weight:800;min-height:22px;text-align:center}
.chars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:8px 0}
.chr{background:#fff3cf;border:3px solid #b48a55;border-radius:12px;text-align:center;cursor:pointer;padding:4px 2px;font-size:13px;font-weight:800}
.chr img{width:100%;max-width:92px;aspect-ratio:3/4;object-fit:contain;display:block;margin:auto}
.chr.sel{border-color:#d2441e;background:#ffe08a;box-shadow:0 0 0 3px #d2441e inset}.chr:hover{background:#ffe9a8}
h2{margin:4px 0 8px;font-size:22px}h3{margin:6px 0;font-size:16px}
#roomCode{font-size:54px;font-weight:900;letter-spacing:.22em;color:#d2441e;-webkit-text-stroke:1px #4a2d14}
#playerList{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0}
.pl{background:#fff3cf;border:3px solid #b48a55;border-radius:12px;text-align:center;padding:4px;font-size:13px;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pl img{width:64px;height:86px;object-fit:contain}.pl b{font-size:15px}.pl.empty{opacity:.4;font-size:34px;border-style:dashed}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,24,34,.6);z-index:30;padding:14px}
.set{display:grid;grid-template-columns:auto 220px;gap:8px 16px;align-items:center;font-weight:700}
.set input[type=range]{width:100%}.set select{font:inherit;font-weight:700;padding:6px;border-radius:8px;border:2px solid #6b4423;background:#fff8e2}
#howText{white-space:pre-line;line-height:1.5;font-weight:600;max-width:680px}
/* HUD */
#hud{display:none;position:fixed;inset:0;z-index:4;pointer-events:none;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.8)}
#objective{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(20,30,20,.55);border:2px solid rgba(255,233,168,.7);border-radius:12px;padding:8px 16px;font-weight:800;font-size:16px;max-width:70vw;text-align:center}
#staWrap{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);width:min(420px,60vw)}
#staBar{height:22px;border:3px solid #2c1a0c;border-radius:12px;background:#3b2b1d;position:relative;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.4)}
#staFill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#b6f05a,#6cc22e);transition:width .08s}
#staFill.low{background:linear-gradient(#ffb04a,#e8662a)}#staFill.boost{background:linear-gradient(#7fe8ff,#2aa8e8)}
#staInj{position:absolute;right:0;top:0;bottom:0;background:repeating-linear-gradient(45deg,#c2332b,#c2332b 6px,#8f1f1a 6px,#8f1f1a 12px)}
#staHun{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,#d9a52e,#d9a52e 6px,#a87b18 6px,#a87b18 12px)}
#alt{position:absolute;right:-74px;top:-2px;font-weight:900;font-size:18px}
#quick{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}
.slot{width:74px;height:74px;border-radius:12px;border:3px solid #4a2d14;background:rgba(246,230,189,.88);position:relative;font-size:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#3a2a17;text-shadow:none}
.slot b{position:absolute;left:5px;top:2px;font-size:12px}.slot i{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:9.5px;font-style:normal;font-weight:800;white-space:nowrap;overflow:hidden}
.slot.sel{border-color:#d2441e;box-shadow:0 0 0 3px #ffd34d;transform:translateY(-5px)}.slot.pick{background:#ffe08a;border-color:#2a8f3a}
#pack{display:none;position:absolute;bottom:150px;left:50%;transform:translateX(-50%);pointer-events:auto;color:#3a2a17;text-shadow:none}
#packslots{display:grid;grid-template-columns:repeat(3,74px);gap:8px;margin:8px 0}
#prompt{display:none;position:absolute;top:60%;left:50%;transform:translateX(-50%);background:rgba(20,20,20,.6);border-radius:10px;padding:8px 14px;font-weight:800;font-size:17px;white-space:nowrap}
#prompt b{background:#ffe08a;color:#3a2a17;border-radius:6px;padding:1px 8px;margin-right:6px;text-shadow:none}
.holdbar{display:block;height:7px;background:rgba(255,255,255,.25);border-radius:4px;margin-top:6px;overflow:hidden}.holdbar span{display:block;height:100%;background:#ffd34d}
#mates{position:absolute;left:12px;top:60px;width:190px}.mate{background:rgba(20,30,20,.5);border-radius:8px;padding:5px 8px;margin-bottom:6px;font-weight:800;font-size:14px}.mate em{float:right;font-style:normal;font-weight:600;font-size:12px}.mate.ko{background:rgba(140,20,20,.6)}
.mbar{height:6px;background:#333;border-radius:3px;margin-top:4px;position:relative;overflow:hidden}.mbar div{position:absolute;left:0;top:0;bottom:0;background:#8fd35a}.mbar i{position:absolute;right:0;top:0;bottom:0;background:#c2332b}
#toasts{position:absolute;right:12px;top:60px;width:min(330px,40vw);display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.toast{background:rgba(20,30,20,.65);border-left:5px solid #ffe08a;border-radius:8px;padding:7px 12px;font-weight:700;font-size:14px;transition:opacity .5s}.toast.out{opacity:0}.toast.bad{border-color:#ee5a44}.toast.ev{border-color:#8fd35a}.toast.hint{border-color:#7fc8d8}
#koBox{display:none;position:absolute;top:36%;left:50%;transform:translateX(-50%);background:rgba(120,10,10,.7);padding:14px 22px;border-radius:12px;font-weight:900;font-size:20px;text-align:center}
#board{display:none;position:absolute;top:70px;left:50%;transform:translateX(-50%);background:linear-gradient(#f6e6bd,#e9d19a);color:#3a2a17;text-shadow:none;border:4px solid #6b4423;border-radius:14px;padding:10px 22px;text-align:center;font-weight:800}
#boardSyms{font-size:40px;letter-spacing:.05em;color:#5a2a1a}
#compass{display:none;position:absolute;top:12px;right:12px;background:rgba(20,30,20,.55);border-radius:10px;padding:6px 12px;font-weight:800}
#fps{display:none;position:absolute;left:12px;top:12px;font-weight:800;font-size:13px}
#keys{position:absolute;left:12px;bottom:12px;font-size:12px;opacity:.8;font-weight:700;line-height:1.5}
#vign{position:absolute;inset:0;box-shadow:inset 0 0 0 0 rgba(200,0,0,0);transition:box-shadow .4s}#vign.hit{box-shadow:inset 0 0 160px 40px rgba(200,0,0,.6)}
#mapview{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-2deg);pointer-events:auto;background:#e2cf9a;border:10px solid #c9b077;border-radius:6px;box-shadow:0 12px 40px rgba(0,0,0,.6);padding:8px;color:#5a3a1a;text-shadow:none;text-align:center;font-weight:800}
#mapcv{width:min(440px,70vw);height:auto;display:block;filter:sepia(.35)}
#loadBar{width:min(420px,70vw);height:18px;border:3px solid #ffe9a8;border-radius:10px;overflow:hidden;margin-top:14px}#loadFill{height:100%;width:0;background:#ffe9a8;transition:width .2s}
#loading{display:flex;background:linear-gradient(#1b6a8f,#0d2a3a)}#loadText{color:#fff;font-weight:700;margin-top:10px}
@media(max-width:760px){.chars,#playerList{grid-template-columns:repeat(3,1fr)}.set{grid-template-columns:1fr}#mates{width:140px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="logoBg"></div>

<div id="loading" class="screen"><h1 class="logo">SURVIVORS</h1><div id="loadBar"><div id="loadFill"></div></div><div id="loadText" data-i18n="load">Wczytywanie wyspy…</div></div>

<div id="menu" class="screen">
  <h1 class="logo">SURVIVORS</h1><div class="sub" data-i18n="m_sub"></div>
  <div class="panel">
    <div class="row"><input id="name" type="text" maxlength="14" data-i18n-ph="m_name"><button id="btnCreate" class="grn" data-i18n="m_create"></button><span style="opacity:.5;font-weight:900">|</span><input id="code" type="text" maxlength="6" data-i18n-ph="m_code"><button id="btnJoin" data-i18n="m_join"></button></div>
    <div id="menuErr" class="err"></div>
    <h3 data-i18n="m_char"></h3><div id="charsMenu" class="chars"></div>
    <div class="row"><button class="alt btnSettings" data-i18n="m_settings"></button><button id="btnHow" class="alt" data-i18n="m_how"></button><button class="dc btnDiscord" data-i18n="m_discord"></button></div>
  </div>
</div>

<div id="lobby" class="screen">
  <div class="panel" style="text-align:center">
    <h2><span data-i18n="l_room"></span>: <span id="roomCode"></span> <button id="btnCopy" class="alt" style="font-size:13px;padding:6px 10px;vertical-align:middle" data-i18n="l_copy"></button></h2>
    <h3 data-i18n="l_players"></h3><div id="playerList"></div>
    <h3 data-i18n="m_char"></h3><div id="charsLobby" class="chars"></div>
    <div id="lobbySolo" class="err" data-i18n="l_solo" style="display:none"></div><div id="lobbyWait" data-i18n="l_wait" style="font-weight:800;display:none"></div>
    <div class="row"><button id="btnStart" class="grn" data-i18n="l_start" style="font-size:24px;padding:12px 44px"></button><button class="dc btnDiscord" data-i18n="m_discord"></button><button class="alt btnSettings" data-i18n="m_settings"></button><button id="btnLeaveLobby" class="red" data-i18n="l_leave"></button></div>
  </div>
</div>

<div id="hud">
  <div id="vign"></div><div id="fps"></div><div id="objective"></div><div id="compass"></div><div id="mates"></div><div id="toasts"></div>
  <div id="board"><div data-i18n="board_title"></div><div id="boardSyms"></div></div>
  <div id="koBox"></div><div id="prompt"></div>
  <div id="pack" class="panel"><b data-i18n="inv_title"></b><div id="packslots"></div><small data-i18n="inv_help"></small></div>
  <div id="quick"></div>
  <div id="staWrap"><div id="staBar"><div id="staFill"></div><div id="staHun"></div><div id="staInj"></div></div><div id="alt"></div></div>
  <div id="mapview"><div data-i18n="map_title"></div><canvas id="mapcv" width="440" height="440"></canvas></div>
  <div id="keys">WASD · Shift · Space · E · F · G · Tab · 1-3 · Esc</div>
</div>

<div id="pause" class="overlay" style="z-index:20"><div class="panel" style="text-align:center"><h2 data-i18n="p_title"></h2>
  <div class="row" style="flex-direction:column"><button id="btnResume" class="grn" data-i18n="p_resume"></button><button class="alt btnSettings" data-i18n="m_settings"></button><button class="dc btnDiscord" data-i18n="m_discord"></button><button id="btnRespawn" data-i18n="p_respawn"></button><button id="btnLeave" class="red" data-i18n="p_leave"></button></div></div></div>

<div id="settings" class="overlay"><div class="panel"><h2 data-i18n="s_title"></h2>
  <div class="set">
    <label data-i18n="m_lang"></label><select id="lang"></select>
    <label data-i18n="s_sens"></label><input id="s_sens" type="range" min="1" max="100">
    <label data-i18n="s_inv"></label><input id="s_inv" type="checkbox">
    <label data-i18n="s_fov"></label><input id="s_fov" type="range" min="50" max="100">
    <label data-i18n="s_shadows"></label><select id="s_shadows"><option value="0" data-i18n="s_off"></option><option value="1" data-i18n="s_low"></option><option value="2" data-i18n="s_high"></option></select>
    <label data-i18n="s_bright"></label><input id="s_bright" type="range" min="0" max="100">
    <label data-i18n="s_quality"></label><select id="s_quality"><option value="0" data-i18n="s_q0"></option><option value="1" data-i18n="s_q1"></option><option value="2" data-i18n="s_q2"></option><option value="3" data-i18n="s_q3"></option></select>
    <label data-i18n="s_dist"></label><select id="s_dist"><option value="0" data-i18n="s_q0"></option><option value="1" data-i18n="s_q1"></option><option value="2" data-i18n="s_q2"></option><option value="3" data-i18n="s_q3"></option></select>
    <label data-i18n="s_vol"></label><input id="s_vol" type="range" min="0" max="100">
    <label data-i18n="s_fps"></label><input id="s_fps" type="checkbox">
  </div>
  <p style="font-size:12px;opacity:.75" data-i18n="s_reload"></p><div class="row"><button id="btnSetClose" class="grn" data-i18n="s_close"></button></div></div></div>

<div id="how" class="overlay"><div class="panel"><h2 data-i18n="m_how"></h2><div id="howText"></div><div class="row"><button id="btnHowClose" class="grn" data-i18n="s_close"></button></div></div></div>

<div id="win" class="screen"><h1 class="logo" data-i18n="win_title"></h1><div class="sub" data-i18n="win_sub"></div><div class="panel" style="text-align:center;font-size:20px"><div id="winStats"></div><div class="row"><button id="btnAgain" class="grn" data-i18n="win_again"></button></div></div></div>

<script src="vendor/three.min.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<script src="vendor/peerjs.min.js"></script>
<script src="js/i18n.js"></script>
<script src="js/world.js"></script>
<script src="js/gfx.js"></script>
<script src="js/net.js"></script>
<script src="js/host.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
